name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_LINE_COVERAGE: "70" # percent; the build fails below this

jobs:
  api:
    name: API build, tests, coverage
    runs-on: ubuntu-latest # has Docker, which the Testcontainers PostgreSQL tests need
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test (integration tests run against PostgreSQL in Testcontainers)
        run: >
          dotnet test --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx;LogFileName=results.trx"

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub;Cobertura;Html
          assemblyfilters: +Identity.Api;-Identity.Tests
          classfilters: -Identity.Api.Data.Migrations.*

      - name: Publish coverage summary and enforce the minimum
        if: always()
        run: |
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage-report/Cobertura.xml").getroot().get("line-rate")) * 100
          minimum = float(os.environ["MIN_LINE_COVERAGE"])
          print(f"line coverage {rate:.1f}% (minimum {minimum:.0f}%)")
          sys.exit(0 if rate >= minimum else 1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-and-test-results
          path: |
            coverage-report/
            coverage/**/results.trx

  console:
    name: Admin console build, tests, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-console/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build
        run: npx ng build --configuration production

      - name: Test (headless Chrome) with coverage
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI --code-coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-coverage
          path: admin-console/coverage/

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [api, console]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Identity API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: identity-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Admin console image
        uses: docker/build-push-action@v6
        with:
          context: admin-console
          push: false
          load: true
          tags: admin-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Images run as non-root
        run: |
          test "$(docker run --rm --entrypoint id identity-api:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id admin-console:ci -u)" != "0"
